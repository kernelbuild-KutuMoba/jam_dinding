name: Pengingat 15 Hari

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis sekali sehari jam 07:00 WIB
  workflow_dispatch:     # Tombol jalankan manual

jobs:
  eksekusi-skrip:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Kode dari Repositori
      uses: actions/checkout@v4.2.2 # <--- Diperbarui ke versi spesifik terbaru untuk mendukung Node 24

    - name: Berikan Izin Akses Eksekusi Skrip
      run: chmod +x cek_hari.sh

    - name: Jalankan Pengecekan Tanggal
      run: bash cek_hari.sh
